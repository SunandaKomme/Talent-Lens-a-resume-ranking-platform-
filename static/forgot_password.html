<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - TalentLens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div class="logo"><div class="logo-circle">T</div>Talent<span>Len</span><span class="logo-lens">🔍</span></div>
    </div>

    <div class="container">
        <h2>Reset Your <span>Password</span></h2>

        <div id="step1">
            <input type="email" id="email" placeholder="Enter your registered email" required>
            <button onclick="verifyEmail()">Continue</button>
        </div>

        <div id="step2" style="display:none;">
            <input type="password" id="newPassword" placeholder="Enter new password" required>
            <button onclick="resetPassword()">Reset Password</button>
        </div>

        <p id="result" style="margin-top:16px; color:#555;"></p>
        <p style="margin-top:16px; color:#555;"><a href="login.html" style="color:#8b5cf6;">Back to Login</a></p>
    </div>

    <script>
        let verifiedEmail = "";

        async function verifyEmail() {
            const email = document.getElementById("email").value;
            const response = await fetch(`http://127.0.0.1:8000/forgot-password?email=${email}`, {
                method: "POST"
            });
            const data = await response.json();

            if (response.ok) {
                verifiedEmail = email;
                document.getElementById("step1").style.display = "none";
                document.getElementById("step2").style.display = "block";
                document.getElementById("result").innerText = "";
            } else {
                document.getElementById("result").innerText = data.detail;
            }
        }

        async function resetPassword() {
            const newPassword = document.getElementById("newPassword").value;
            const response = await fetch(`http://127.0.0.1:8000/reset-password?email=${verifiedEmail}&new_password=${newPassword}`, {
                method: "POST"
            });
            const data = await response.json();

            if (response.ok) {
                document.getElementById("result").innerText = "Password reset! Redirecting to login...";
                setTimeout(() => window.location.href = "login.html", 1500);
            } else {
                document.getElementById("result").innerText = data.detail;
            }
        }
    </script>
</body>
</html>
