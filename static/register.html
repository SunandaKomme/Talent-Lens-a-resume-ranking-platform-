<!DOCTYPE html>
<html>
<head>
    <title>Register - Resume Ranker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="/" style="text-decoration:none;">
    <div class="logo"><div class="logo-circle">T</div>Talent<span>Lens</span> <span class="logo-lens">🔍</span></div>
</a>
</div>

    <div class="container">
        <h2>Create an <span>Account</span></h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p id="result" style="margin-top:16px; color:#a5a5b8;"></p>
        <p style="margin-top:16px; color:#a5a5b8;">Already have an account? <a href="login.html" style="color:#8b5cf6;">Login here</a></p>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch(`http://127.0.0.1:8000/register?name=${name}&email=${email}&password=${password}`, {
                method: "POST"
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById("result").innerText = "Registered successfully! You can now log in.";
            } else {
                document.getElementById("result").innerText = data.detail;
            }
        });
    </script>
</body>
</html>
